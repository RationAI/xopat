services:
  xopat-node:
    build:
      context: ../../
      dockerfile: docker/node/Dockerfile
      target: viewer-standalone
    entrypoint: ["node", "index.js"]
    ports:
      - "9001:9000"
    environment:
      # If the server must reach TRUSTED internal backends over private IPs —
      # e.g. a sibling container `internal-backend` fronting an LLM / Whisper endpoint
      # on this compose network — the SSRF guard would otherwise refuse them
      # (private/reserved IPs are the SSRF target surface). Declare the specific
      # trusted host(s) or subnet here; everything else stays blocked. Unset =
      # strict. See server/ENVIRONMENT.md → "SSRF: trusted internal upstreams".
      # XOPAT_SSRF_ALLOWED_CIDRS: "172.28.0.0/16"
      # XOPAT_SSRF_ALLOWED_HOSTS: "internal-backend"
      XOPAT_ENV: >-
        {
          "core": {
            "gateway": "https://xopat.org",
            "active_client": "localhost",
            "client": {
              "localhost": {
                "domain": "http://localhost:9001",
                "path": "/",
                "image_group_server": "http://localhost:9002",
                "image_group_protocol": "`$${path}/v3/batch/info?slides=$${data}`",
                "data_group_server": "http://localhost:9002",
                "data_group_protocol": "`$${path}/v3/batch/info?slides=$${data.join(\",\")}`",
                "headers": {},
                "js_cookie_expire": 365,
                "js_cookie_path": "/",
                "js_cookie_same_site": "",
                "js_cookie_secure": "",
                "secureMode": false,
              }
            },
            "setup": {
              "locale": "en",
              "customBlending": false,
              "debugMode": false,
              "webglDebugMode": false,
            }
          },
          "plugins": {
          },
          "modules": {
            "empaia-wsi-tile-source": {
              "permaLoad": true
            }
          }
        }