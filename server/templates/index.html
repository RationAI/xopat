    <!--
        Pre-boot capture. Errors happen before any bundle is parsed, and this is the
        only thing that can see them. It hands over to the real client logging broker
        (APPLICATION_CONTEXT.log, src/classes/app/logging.ts) as soon as the app
        context is built: the broker drains this array, routes console.* into its
        `console` channel and replaces `appTrace` with a bounded view. Until then the
        array is capped here — it used to grow for the whole session.
        See src/LOGGING.md.
    -->
    <script type="text/javascript">
        (function () {
            window.console.appTrace = [];
            const PRE_BOOT_TRACE_MAX = 500;
            const remember = function (parts) {
                if (window.console.__appTraceOwned) return;   // the broker took over
                const trace = window.console.appTrace;
                if (!Array.isArray(trace)) return;
                trace.push.apply(trace, parts);
                if (trace.length > PRE_BOOT_TRACE_MAX) trace.splice(0, trace.length - PRE_BOOT_TRACE_MAX);
            };

            // Benign Chromium warning: a ResizeObserver callback dirtied layout and
            // queued another notification in the same frame. State is consistent on
            // the next frame, so don't pop the error overlay or log it as ERROR.
            window.isResizeObserverLoopMessage = function (msg) {
                if (msg == null) return false;
                const text = typeof msg === "string" ? msg : (msg.message || String(msg));
                return text.indexOf("ResizeObserver loop") !== -1;
            };

            // A stack is worth gluing onto a console line only BEFORE the broker
            // exists: pre-boot there is no channel, no record and no other way to
            // learn where a warning came from. Afterwards the broker records the
            // call itself, and this decoration actively misleads — every routine
            // `log.warn(...)` renders as `WARN … / Error at …` with the broker's own
            // frames on top, which reads as a thrown exception rather than a warning.
            // Stand down when `remember()` does (see `__appTraceOwned`).
            const preBoot = function () {
                return !window.console.__appTraceOwned;
            };

            const defaultError = console.error;
            const timestamp = () => {
                let ts = new Date(), pad = "000", ms = ts.getMilliseconds().toString();
                return ts.toLocaleTimeString("cs-CZ") + "." + pad.substring(0, pad.length - ms.length) + ms + " ";
            };
            window.console.error = function (...args) {
                remember(["ERROR ",
                    // (new Error().stack.split("at ")[1]).trim(), " ",
                    timestamp(), ...args, "\n"]);

                if (!preBoot()) return defaultError.apply(window.console, args);
                defaultError.apply(window.console, [...args, new Error().stack]);
            };

            const defaultWarn = console.warn;
            window.console.warn = function (...args) {
                remember(["WARN  ", ...args, "\n"]);
                if (!preBoot()) return defaultWarn.apply(window.console, args);
                defaultWarn.apply(window.console, [...args, new Error().stack]);
            };

            window.addEventListener('error', e => {
                const payload = e.error || e.message;
                if (window.isResizeObserverLoopMessage(payload)) {
                    console.debug('ResizeObserver loop suppressed:', payload);
                    return;
                }
                console.error('window error:', payload);
            });
            window.addEventListener('unhandledrejection', e => {
                if (window.isResizeObserverLoopMessage(e.reason)) {
                    console.debug('ResizeObserver loop suppressed:', e.reason);
                    return;
                }
                console.error('unhandledrejection:', e.reason);
            });
        })();
    </script>

<!-- System messaging: full-viewport blocking error overlay (DaisyUI card on a dim backdrop). -->
<div id="system-message" class="hidden fixed inset-0 flex items-center justify-center p-4 bg-base-content/45 backdrop-blur-sm" style="z-index: 999999;">
    <div class="card bg-base-100 border border-error/40 shadow-2xl w-[min(720px,92vw)] max-h-[90vh] overflow-hidden">
        <div class="card-body gap-3 overflow-y-auto">
            <div id="system-message-warn" class="flex items-center justify-center gap-2 text-3xl font-light text-error">
                <span class="ph-light ph-warning"></span>
                <span data-i18n="error.title">Error</span>
            </div>
            <div id="system-message-title" class="text-xl font-light text-center text-base-content"></div>
            <div id="system-message-subtitle" class="text-base text-center text-base-content/80"></div>
            <div class="text-xs text-center text-base-content/60" data-i18n="error.doExport"> [ if you want to report a problem, please include exported file ] </div>
            <div class="flex flex-wrap justify-center gap-2 mt-1">
                <button id="system-message-details-btn"
                        onclick="document.getElementById('system-message-details').classList.remove('hidden'); this.classList.add('hidden');"
                        class="btn btn-ghost btn-sm" type="button" data-i18n="error.detailsBtn">details</button>
                <button id="system-message-dismiss-btn" onclick="USER_INTERFACE.Errors.hide()"
                        class="btn btn-primary btn-sm" type="button" data-i18n="error.dismissBtn">dismiss</button>
            </div>
            <div id="system-message-details" class="hidden bg-base-200 text-base-content font-mono text-xs leading-relaxed px-4 py-3 rounded-lg border border-base-300 max-h-[50vh] overflow-auto whitespace-pre-wrap break-words"></div>
        </div>
    </div>
</div>

    <script>
// Boot-failure screen. Live only until the app is up: `wireGlobalRuntimeErrorHandler`
// (src/classes/app/global-error-handler.ts) retires it once the viewer manager exists,
// after which uncaught errors become toasts.
//
// An uncaught error in this window means the application did not start, and by far the
// most common reason is bundles that do not belong together — a core build (src/dist)
// older than the UI bundle and module files served with it — which surfaces as
// `APPLICATION_CONTEXT.<something> is undefined`. So this says that, instead of
// "Unknown error" behind a spinner that never stops: #fullscreen-loader shares this
// card's z-index and comes later in the document, so it has to be hidden explicitly.
//
// Deliberately self-contained (the template's own elements, `textContent` only): it
// must work when the failure is early enough that USER_INTERFACE does not exist.
(function () {
    let shown = false;
    // i18next is initialized inside initXOpat. A failure before that point can only be
    // reported in English — there is no translator yet, and the placeholder `$.t`
    // would print the key's last segment.
    const text = function (key, english) {
        try {
            if (window.i18next && window.i18next.isInitialized && window.$ && typeof window.$.t === "function") {
                return window.$.t(key);
            }
        } catch (e) { /* fall through to English */ }
        return english;
    };
    const setText = function (id, value) {
        const node = document.getElementById(id);
        if (node) node.textContent = value;
    };

    window.onerror = function (message, file, line, col, error) {
        if (window.isResizeObserverLoopMessage && window.isResizeObserverLoopMessage(error || message)) {
            console.debug('ResizeObserver loop suppressed:', message);
            return false;
        }
        // First error wins: what follows is the cascade of the first one (globals that
        // were never assigned), and it would replace the only informative message.
        if (shown) return false;
        shown = true;

        const loader = document.getElementById("fullscreen-loader");
        if (loader) loader.style.display = "none";

        const details = [String((error && error.message) || message || "")];
        if (file) details.push("in " + file + (line ? ", line " + line : ""));
        // Dev mode only: the server compared the core bundle with its sources.
        const stale = Array.isArray(window.XOPAT_STALE_BUNDLES) ? window.XOPAT_STALE_BUNDLES : [];
        if (stale.length) {
            details.push("", "Out-of-date build detected:");
            for (const entry of stale) details.push("  " + String(entry));
            details.push("Start the dev watcher (npm run dev) and check its output for a failed build.");
        }

        setText("system-message-title", text("error.bootFailedTitle", "The viewer could not start."));
        setText("system-message-subtitle", text("error.bootFailedDescription",
            "The application files look incomplete or out of date. Reload the page; if it keeps happening, the application needs to be rebuilt."));
        setText("system-message-details", details.join("\n"));
        const card = document.getElementById("system-message");
        if (card) card.classList.remove("hidden");

        // Keep the app's own bookkeeping consistent when it got far enough to exist.
        try {
            if (window.USER_INTERFACE && window.USER_INTERFACE.Errors) window.USER_INTERFACE.Errors.active = true;
        } catch (e) { /* not there yet */ }
        return false;
    };
})();
    </script>

        APPLICATION_CONTEXT.beginApplicationLifecycle(

            APPLICATION_CONTEXT.config.visualizations
        );
    });
</script>
